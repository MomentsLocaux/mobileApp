name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-client-secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan public env + client source for denylist secrets
        run: node scripts/check-client-secrets.mjs
